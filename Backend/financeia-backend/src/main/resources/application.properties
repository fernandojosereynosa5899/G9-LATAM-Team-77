spring.application.name=financeia-backend

# Conexion a Base de Datos (Railway MySQL por defecto si se proveen variables, sino H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:financeia_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.flywaydb=DEBUG

# Clave de firma JWT configurada mediante variable de entorno
jwt.secret=${JWT_SECRET:8a9b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u2v3w4x5y6z7a8b9c0d1e2f3}spring.main.allow-bean-definition-overriding=true
